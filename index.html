<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Nilai Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .bg-hero-gradient {
    background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 45%, #a78bfa 100%);
  }
  .fade-in { animation: fadeIn .4s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-neutral-100 min-h-screen text-neutral-800">

  <!-- ========================= HEADER ========================= -->
  <header class="bg-hero-gradient text-white">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Dashboard Nilai Admin - Bilangan Bulat</h1>
      <p class="mt-2 text-purple-100 text-sm md:text-base">Pantau hasil kuis peserta secara real-time.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 -mt-8 pb-16">

    <!-- ========================= STAT CARDS ========================= -->
    <section class="grid sm:grid-cols-2 gap-4 mb-6 fade-in">
      <div class="bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-2xl">👥</div>
        <div>
          <p class="text-sm text-neutral-500">Total Peserta</p>
          <p id="stat-total" class="text-2xl font-bold text-neutral-800">0</p>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-violet-100 flex items-center justify-center text-2xl">📊</div>
        <div>
          <p class="text-sm text-neutral-500">Rata-rata Nilai</p>
          <p id="stat-avg" class="text-2xl font-bold text-neutral-800">0</p>
        </div>
      </div>
    </section>

    <!-- ========================= TABEL ========================= -->
    <section class="bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 md:p-8 fade-in">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <h2 class="text-lg font-semibold text-neutral-800">Data Hasil Kuis (Real-Time)</h2>
        <input
          id="search-input"
          type="text"
          placeholder="Cari berdasarkan Nama atau Kelas..."
          class="w-full sm:w-72 rounded-lg border border-neutral-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
        />
      </div>

      <div class="overflow-x-auto rounded-xl border border-neutral-200">
        <table class="min-w-full text-sm">
          <thead class="bg-neutral-50 text-neutral-500 uppercase text-xs">
            <tr>
              <th class="px-4 py-3 text-left">Waktu Selesai</th>
              <th class="px-4 py-3 text-left">Nama User</th>
              <th class="px-4 py-3 text-left">Kelas / Departemen</th>
              <th class="px-4 py-3 text-left">Email</th>
              <th class="px-4 py-3 text-left">Skor Akhir</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-neutral-200">
            <tr>
              <td colspan="5" class="px-4 py-6 text-center text-neutral-400">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ========================= FIREBASE (MODULAR v10) ========================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ============================================================
    // 🔧 UBAH DI SINI: Konfigurasi Firebase kamu
    // HARUS SAMA PERSIS dengan konfigurasi di index.html (proyek Firebase yang sama)
    // Ambil dari: Firebase Console > Project Settings > General > "Your apps" > SDK setup and configuration
    // ============================================================
    const firebaseConfig = {
    apiKey: "AIzaSyDJENdjNPj4b9G2nzl1X-C12iTv_oZpTl4",
    authDomain: "kuis-mtk-app.firebaseapp.com",
    projectId: "kuis-mtk-app",
    storageBucket: "kuis-mtk-app.firebasestorage.app",
    messagingSenderId: "546398118889",
    appId: "1:546398118889:web:4185b0dbb1fdb46b2ca178"
  };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ============================================================
    // State lokal: menyimpan seluruh data dari Firestore untuk difilter di search bar
    // ============================================================
    let allData = [];

    const tableBody = document.getElementById("table-body");
    const statTotal = document.getElementById("stat-total");
    const statAvg = document.getElementById("stat-avg");
    const searchInput = document.getElementById("search-input");

    // Badge warna berdasarkan skor
    function getBadge(skor) {
      if (skor >= 80) return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">${skor}</span>`;
      if (skor >= 60) return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">${skor}</span>`;
      return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">${skor}</span>`;
    }

    function formatWaktu(timestamp) {
      if (!timestamp || !timestamp.toDate) return "-";
      const d = timestamp.toDate();
      return d.toLocaleString("id-ID", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    // Render tabel berdasarkan data yang sudah difilter
    function renderTable(data) {
      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-neutral-400">Belum ada data.</td></tr>`;
        return;
      }
      tableBody.innerHTML = data.map(item => `
        <tr class="hover:bg-neutral-50 transition">
          <td class="px-4 py-3 whitespace-nowrap text-neutral-500">${formatWaktu(item.waktu_selesai)}</td>
          <td class="px-4 py-3 font-medium text-neutral-800">${item.nama || "-"}</td>
          <td class="px-4 py-3">${item.kelas || "-"}</td>
          <td class="px-4 py-3 text-neutral-500">${item.email || "-"}</td>
          <td class="px-4 py-3">${getBadge(item.skor ?? 0)}</td>
        </tr>
      `).join("");
    }

    // Update dua kartu statistik (total peserta & rata-rata nilai)
    function updateStats(data) {
      statTotal.textContent = data.length;
      if (data.length === 0) {
        statAvg.textContent = "0";
        return;
      }
      const totalSkor = data.reduce((sum, item) => sum + (item.skor || 0), 0);
      statAvg.textContent = Math.round(totalSkor / data.length);
    }

    // Filter data berdasarkan input search (nama atau kelas)
    function applyFilter() {
      const keyword = searchInput.value.trim().toLowerCase();
      const filtered = allData.filter(item =>
        (item.nama || "").toLowerCase().includes(keyword) ||
        (item.kelas || "").toLowerCase().includes(keyword)
      );
      renderTable(filtered);
    }

    searchInput.addEventListener("input", applyFilter);

    // ============================================================
    // Real-time listener ke koleksi "hasil_kuis", diurutkan dari yang terbaru
    // ============================================================
    const q = query(collection(db, "hasil_kuis"), orderBy("waktu_selesai", "desc"));

    onSnapshot(q, (snapshot) => {
      allData = snapshot.docs.map(doc => doc.data());
      updateStats(allData);
      applyFilter();
    }, (error) => {
      console.error("Gagal mengambil data Firestore:", error);
      tableBody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-red-500">⚠️ Gagal memuat data. Periksa konfigurasi Firebase.</td></tr>`;
    });
  </script>
</body>
</html>
